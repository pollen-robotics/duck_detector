[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "duck-detector"
version = "0.1.0"
description = "Finding Microducks in a Microduck's camera: capture, labelling, training and the NPU export"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# What every stage needs: the Hub (data and models live there, and the rendezvous that reaches
# a robot authenticates with its token), the robot's frame stream, and reading a JPEG.
dependencies = [
    "pillow>=11.0",
    "huggingface_hub>=1.0",
    "httpx>=0.27",
    "websockets>=13",
]

[dependency-groups]
# Dev only, and installed by a plain `uv sync` — so the tests run without pulling CUDA.
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.optional-dependencies]
# Training and labelling pull CUDA wheels and a few gigabytes of weights, and neither is
# needed to capture a session from a robot. `uv sync` gets you the capture tool; `uv sync
# --extra train` gets the rest.
train = [
    "ultralytics>=8.3",
    "onnx>=1.17",
    "onnxruntime>=1.20",
]
label = [
    "torch>=2.5",
    "transformers>=4.46",
]
# The correction pass. Its own extra because Label Studio is a Django application and a few hundred
# megabytes of it, and nothing else here needs a web app.
review = [
    "label-studio>=1.13",
]

[project.scripts]
# One command per stage of the pipeline in the README.
capture = "duck_detector.capture:main"
triage = "duck_detector.triage:main"
autolabel = "duck_detector.autolabel:main"
review = "duck_detector.review:main"
dataset = "duck_detector.dataset:main"
train = "duck_detector.train:main"
agreement = "duck_detector.agreement:main"
model = "duck_detector.model:main"

[tool.ruff]
src = ["src"]
indent-width = 4
# Wider than ruff's 88 to match the Rust side of the fence, where the robot's code sits at 100.
# The comments here carry reasoning, and rewrapping prose at 88 costs a line in three.
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
